<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Promo widget test page</title>
  <link rel="stylesheet" href="widget.css">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    button.host { margin: 0 .4rem .4rem 0; }
    pre { background: #f3f4f6; padding: .75rem; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Widget test page</h1>
  <p>Open at <code>http://localhost:8000/widget/test.html</code>. The host "cart" is a plain array.</p>
  <button class="host" data-add="GT100">Add Green Tea</button>
  <button class="host" data-add="SF100">Add Sugar-Free Sweetener</button>
  <button class="host" id="clear">Clear cart</button>
  <button class="host" id="pay">Pay</button>
  <pre id="cart"></pre>
  <div id="promo-widget"></div>
  <pre id="log"></pre>

  <script src="widget.js"></script>
  <script>
    var cart = [];
    function show() { document.getElementById("cart").textContent = "cart: " + JSON.stringify(cart); }
    function log(label, value) { document.getElementById("log").textContent = label + ": " + JSON.stringify(value, null, 1); }
    function add(sku) {
      var line = cart.find(function (i) { return i.sku === sku; });
      if (line) line.qty += 1; else cart.push({ sku: sku, qty: 1 });
      show();
      PromoWidget.refresh();
    }
    document.querySelectorAll("[data-add]").forEach(function (b) {
      b.addEventListener("click", function () { add(b.dataset.add); });
    });
    document.getElementById("clear").addEventListener("click", function () { cart = []; show(); PromoWidget.refresh(); });
    document.getElementById("pay").addEventListener("click", function () {
      PromoWidget.pay().catch(function (err) { log("pay error", err.message); });
    });
    PromoWidget.init({
      apiBase: location.origin,
      imageBase: "http://localhost:3000",
      container: "#promo-widget",
      getCart: function () { return cart; },
      onAddItem: function (sku) { add(sku); },
      onTotals: function (totals) { log("onTotals", totals); },
      onPay: function (result) { cart = []; show(); log("onPay", result); },
    });
    show();
  </script>
</body>
</html>
